<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Mikhail Gorokhoov — Education, AI and Simulation</title>
  <desc id="bannerDesc">Dark banner with the name Mikhail Gorokhoov, the words Education, AI and Simulation, and a slowly orbiting three-body diagram.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1322"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.35" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1010" cy="180" r="330" fill="url(#glow)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.45">
    <path d="M0 90h1280M0 180h1280M0 270h1280"/>
    <path d="M160 0v360M320 0v360M480 0v360M640 0v360M800 0v360M960 0v360M1120 0v360"/>
  </g>

  <g fill="#334155" opacity="0.55">
    <circle cx="64" cy="48" r="1.5"/><circle cx="96" cy="48" r="1.5"/><circle cx="128" cy="48" r="1.5"/>
    <circle cx="64" cy="72" r="1.5"/><circle cx="96" cy="72" r="1.5"/><circle cx="128" cy="72" r="1.5"/>
  </g>

  <text x="72" y="104" fill="#67e8f9" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="3.5">EDUCATION × AI × SIMULATION</text>
  <text x="72" y="172" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="-1.2">Mikhail Gorokhoov</text>
  <text x="72" y="216" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">I build tools for learning, intelligent systems,</text>
  <text x="72" y="244" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19">and simulations you can explore.</text>

  <rect x="72" y="278" width="128" height="2" fill="url(#rule)"/>
  <text x="72" y="316" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.8">github.com/magorokhoov  ·  t.me/magorokhoov</text>

  <g transform="translate(1010 180)">
    <g fill="none" stroke="#334155">
      <ellipse rx="180" ry="64" transform="rotate(-18)" opacity="0.85"/>
      <ellipse rx="230" ry="82" transform="rotate(12)" opacity="0.55"/>
      <ellipse rx="140" ry="48" transform="rotate(-38)" opacity="0.5"/>
    </g>

    <circle r="78" fill="url(#core)" opacity="0.18"/>

    <circle r="12" fill="none" stroke="#67e8f9" stroke-width="1.2" opacity="0.45">
      <animate attributeName="r" values="10;38;10" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="5.5s" repeatCount="indefinite"/>
    </circle>

    <circle r="5.5" fill="#e2e8f0"/>
    <circle r="2.2" fill="#67e8f9"/>

    <g transform="rotate(-18)">
      <circle r="5" fill="#67e8f9">
        <animateMotion dur="17s" repeatCount="indefinite" path="M 180 0 A 180 64 0 1 1 -180 0 A 180 64 0 1 1 180 0"/>
      </circle>
      <circle r="2.5" fill="#67e8f9" opacity="0.55">
        <animateMotion dur="17s" begin="-8.5s" repeatCount="indefinite" path="M 180 0 A 180 64 0 1 1 -180 0 A 180 64 0 1 1 180 0"/>
      </circle>
    </g>

    <g transform="rotate(12)">
      <circle r="4.5" fill="#c4b5fd">
        <animateMotion dur="26s" repeatCount="indefinite" path="M 230 0 A 230 82 0 1 1 -230 0 A 230 82 0 1 1 230 0"/>
      </circle>
    </g>

    <g transform="rotate(-38)">
      <circle r="3.8" fill="#6ee7b7">
        <animateMotion dur="12s" repeatCount="indefinite" path="M 140 0 A 140 48 0 1 1 -140 0 A 140 48 0 1 1 140 0"/>
      </circle>
    </g>

    <g fill="#7dd3fc">
      <circle cx="-248" cy="-112" r="1.4" opacity="0.7">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="270" cy="96" r="1.2" opacity="0.5">
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="216" cy="-128" r="1.6" opacity="0.5">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
